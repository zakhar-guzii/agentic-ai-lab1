schema: spec-driven

context: |
  Університетська лабораторна; єдиний критерій обсягу — рубрика в docs/AgenticAI_Lab1.md.
  Артефакти пишуться українською для читача, який не знає передісторії проєкту.
  docs/design.md — архітектура, обмеження й обґрунтування; docs/contracts.md — контракти інструментів (точні схеми — docs/tool-schemas.json);
  docs/defense.md — сценарій захисту. Вони оновлюються, коли задачі щось уточнюють.

rules:
  proposal:
    - Описуй, що буде збудовано і навіщо це лабі. Без історії попередніх версій, аудитів і списків «відкладено» чи «вилучено».
  design:
    - Пояснюй кожен термін при першій згадці. Рішення обґрунтовуй по суті, без посилань на попередні версії чи номери зауважень.
    - Не додавай розділів «Migration Plan» і таблиць закриття зауважень. Не пиши «зафіксовано в docs/design.md».
  tasks:
    - Задача належить тому change, чий код вона перевіряє.
    - README — лише встановлення, налаштування, команди запуску й посилання на docs; це не документація системи.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
